<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The source of public/apple-touch-icon.png. iOS rounds the corners itself and turns transparency black, so unlike
       the favicon this fills the whole square. To make the PNG again (macOS):
         qlmanage -t -s 180 -o /tmp/icon packages/web/design/apple-touch-icon.svg
         cp /tmp/icon/apple-touch-icon.svg.png packages/web/public/apple-touch-icon.png -->
  <rect width="32" height="32" fill="#f76b15"/>
  <path fill="#fff" d="M16 9.5c-2.2-1.6-5.4-2.1-9-1.5v14c3.6-.6 6.8-.1 9 1.5 2.2-1.6 5.4-2.1 9-1.5V8c-3.6-.6-6.8-.1-9 1.5z"/>
  <path d="M16 9.5v14" stroke="#f76b15" stroke-width="1.4" fill="none"/>
</svg>
